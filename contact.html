    <p>Ja Jums ir kādi jautājumi vai ierosinājumi, aizpildiet zemāk esošo formu, un mēs sazināsimies ar jums pēc iespējas ātrāk.</p>

    <form action="https://formsubmit.co/2025murratava@gmail.com" method="POST" class="contact-form">
      <label for="name">Vārds:</label>
      <input type="text" id="name" name="name" required>

      <label for="email">E-pasts:</label>
      <input type="email" id="email" name="email" required>

      <label for="message">Ziņojums:</label>
      <textarea id="message" name="message" rows="5" required></textarea>

      <button type="submit">Sūtīt</button>
  </form>
